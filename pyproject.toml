[project]
name = "yq-fusion"
version = "0.1.0"
description = "YanQue-Media-Fusion: 可中断可反馈的内容生成 → 成品渲染 → 发布管线"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "pydantic>=2.7",
    "pillow>=10.0",
    "edge-tts>=7.0.0",
    "imageio-ffmpeg>=0.6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
