<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>YanQue Media · 内容成片工作台</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span>YanQue Media</span>
  </div>
  <div class="health" id="health">
    <span class="dot"></span>
    <span id="health-text">连接中…</span>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-primary" id="btn-new">
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
    新建任务
  </button>
</header>

<main class="shell">
  <aside class="sidebar">
    <div class="sidebar-title">
      <span>任务</span>
      <button class="btn btn-ghost btn-sm" id="btn-refresh">刷新</button>
    </div>
    <div class="task-list" id="task-list">
      <div class="skeleton" style="height: 66px"></div>
      <div class="skeleton" style="height: 66px"></div>
      <div class="skeleton" style="height: 66px"></div>
    </div>
  </aside>

  <section class="stage" id="stage">
    <div class="panel">
      <div class="empty">
        <div class="empty-mark">🎬</div>
        <div class="empty-title">选一条任务，或者新建一条</div>
        <div class="subtle">选题 → 脚本 → 素材 → 成片 → 发布，每一步都停下来等你确认</div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">新建内容任务</h2>
    <p class="subtle">写一句你想讲的主题，剩下的交给管线。</p>
    <div class="field">
      <label for="brief">内容简报</label>
      <input type="text" id="brief" placeholder="例如：AI 剪辑入门，给完全没基础的人" maxlength="500" />
    </div>
    <div class="field">
      <label for="style">风格（可选）</label>
      <input type="text" id="style" placeholder="例如：口语、克制、有具体步骤" maxlength="200" />
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-create">创建并开始</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
