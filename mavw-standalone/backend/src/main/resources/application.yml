server:
  port: 8088

spring:
  application:
    name: mavw-standalone-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mavw:
  # Python 渲染引擎地址（出图 / TTS / 字幕 / 渲染都在这里）
  python-base-url: http://127.0.0.1:8010
  proxy:
    connect-timeout-ms: 5000
    request-timeout-ms: 600000
  # 允许跨源的前端地址（Vite dev server 默认 5173）
  cors-allowed-origins:
    - http://127.0.0.1:5173
    - http://localhost:5173

logging:
  level:
    com.mavw.standalone: DEBUG
