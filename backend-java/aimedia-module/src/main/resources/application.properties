# 启动器模式（-Plauncher）专用配置。放在 classpath 根，只在 launcher profile 生效时被加载。
server.port=8088
spring.application.name=aimedia-launcher

# 上传大小上限（图片/TTS 素材）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Python 渲染引擎地址（出图 / TTS / 字幕 / 渲染都在这里）
mavw.python-base-url=http://127.0.0.1:8010
mavw.proxy.connect-timeout-ms=5000
mavw.proxy.request-timeout-ms=600000

# 前端静态目录：默认相对工作目录（aimedia-module）的 ../frontend
# 如从仓库根启动，可改为 backend-java/frontend 的绝对路径
mavw.frontend-dir=

logging.level.com.yanque.aimedia=INFO
